<svg id="gh-dark-mode-only" width="400" height="240" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ov-title ov-desc">
<title id="ov-title">GitHub overview</title>
<desc id="ov-desc">Repositories, forks of my repositories, all-time contributions, and lines of code changed.</desc>
<style>
  .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  #gh-dark-mode-only:target .card { fill: #0d1117; stroke: #30363d; }
  .title, .label, .value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 13px; line-height: 18px; font-weight: 600; color: #1f2328; }
  #gh-dark-mode-only:target .title { color: #e6edf3; }
  .rule { height: 1px; background: #d8dee4; margin: 8px 0; }
  #gh-dark-mode-only:target .rule { background: #30363d; }
  .stats { display: flex; flex-direction: column; }
  .stat { display: flex; align-items: center; justify-content: space-between; height: 40px; }
  .label { font-size: 12px; line-height: 16px; color: #656d76; white-space: nowrap; }
  #gh-dark-mode-only:target .label { color: #8b949e; }
  .value { font-size: 15px; line-height: 20px; font-weight: 600; color: #1f2328; font-variant-numeric: tabular-nums; }
  #gh-dark-mode-only:target .value { color: #e6edf3; }
</style>
<rect x="0.5" y="0.5" width="399" height="239" rx="6" class="card"/>
<foreignObject x="20" y="20" width="360" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml">
    <div class="title">Overview</div>
    <div class="rule"></div>
    <div class="stats">
      <div class="stat"><span class="label">Repositories</span><span class="value">103</span></div>
      <div class="stat"><span class="label">Forks of my repositories</span><span class="value">103</span></div>
      <div class="stat"><span class="label">All-time contributions</span><span class="value">26,296</span></div>
      <div class="stat"><span class="label">Lines of code changed</span><span class="value">47,122,745</span></div>
    </div>
  </div>
</foreignObject>
</svg>
