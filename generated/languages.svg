<svg id="gh-dark-mode-only" width="400" height="240" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lang-title lang-desc">
<title id="lang-title">Languages by file size</title>
<desc id="lang-desc">Languages by file size, ranked. The top eight languages are listed separately. The remaining languages are grouped as Other.</desc>
<style>
  .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  #gh-dark-mode-only:target .card { fill: #0d1117; stroke: #30363d; }
  .title, .name, .pct { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 13px; line-height: 18px; font-weight: 600; color: #1f2328; }
  #gh-dark-mode-only:target .title { color: #e6edf3; }
  .rule { height: 1px; background: #d8dee4; margin: 8px 0; }
  #gh-dark-mode-only:target .rule { background: #30363d; }
  .rows { display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 104px 1fr 42px; align-items: center; gap: 8px; height: 18px; }
  .name { font-size: 12px; line-height: 16px; color: #1f2328; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gh-dark-mode-only:target .name { color: #e6edf3; }
  .track { height: 6px; background: #f6f8fa; border-radius: 3px; overflow: hidden; }
  #gh-dark-mode-only:target .track { background: #21262d; }
  .fill { display: block; height: 100%; background: #0969da; border-radius: 3px; }
  #gh-dark-mode-only:target .fill { background: #58a6ff; }
  .pct { font-size: 11px; line-height: 16px; color: #656d76; text-align: right; font-variant-numeric: tabular-nums; }
  #gh-dark-mode-only:target .pct { color: #8b949e; }
  .other .name, .other .pct { color: #656d76; }
  #gh-dark-mode-only:target .other .name, #gh-dark-mode-only:target .other .pct { color: #8b949e; }
  .other .fill { background: #8b949e; }
  #gh-dark-mode-only:target .other .fill { background: #6e7681; }
</style>
<rect x="0.5" y="0.5" width="399" height="239" rx="6" class="card"/>
<foreignObject x="20" y="20" width="360" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml">
    <div class="title">Languages by file size</div>
    <div class="rule"></div>
    <div class="rows">
<div class="row"><span class="name">Python</span><span class="track"><span class="fill" style="width:100.0%"></span></span><span class="pct">31.3%</span></div>
<div class="row"><span class="name">Rust</span><span class="track"><span class="fill" style="width:90.1%"></span></span><span class="pct">28.2%</span></div>
<div class="row"><span class="name">JavaScript</span><span class="track"><span class="fill" style="width:45.9%"></span></span><span class="pct">14.4%</span></div>
<div class="row"><span class="name">TypeScript</span><span class="track"><span class="fill" style="width:28.5%"></span></span><span class="pct">8.9%</span></div>
<div class="row"><span class="name">Kotlin</span><span class="track"><span class="fill" style="width:16.6%"></span></span><span class="pct">5.2%</span></div>
<div class="row"><span class="name">GDScript</span><span class="track"><span class="fill" style="width:12.7%"></span></span><span class="pct">4.0%</span></div>
<div class="row"><span class="name">C</span><span class="track"><span class="fill" style="width:10.1%"></span></span><span class="pct">3.2%</span></div>
<div class="row"><span class="name">Svelte</span><span class="track"><span class="fill" style="width:4.7%"></span></span><span class="pct">1.5%</span></div>
<div class="row other"><span class="name">Other (26)</span><span class="track"><span class="fill" style="width:10.9%"></span></span><span class="pct">3.4%</span></div>
    </div>
  </div>
</foreignObject>
</svg>
